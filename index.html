<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Right Form of Verb – ৩০টি অনুশীলনী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://www.apple.com/wss/fonts?families=SF+Pro,v3|SF+Pro+Icons,v3">
<style>
  :root{
    --bg:#f2f5fa; --card:#ffffff; --ink:#14213d; --muted:#5b6780;
    --line:#d9e0ec; --accent:#2a5fd6; --ok:#17794d; --ok-bg:#e6f5ed;
    --c-tense:#2a5fd6; --c-cond:#b4561a; --c-nonfin:#7b3fb0; --c-agree:#0f7f86;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1626; --card:#18213a; --ink:#e8edf8; --muted:#9aa7c2;
      --line:#2a3558; --accent:#7ea3ff; --ok:#6fdca4; --ok-bg:#12332a;
      --c-tense:#7ea3ff; --c-cond:#f0a56b; --c-nonfin:#c79bf0; --c-agree:#62d3da;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px; margin:0 auto; padding:28px 16px 64px}
  header{margin-bottom:22px}
  h1{font-size:clamp(1.5rem,4.5vw,2.1rem); line-height:1.3; margin:0 0 8px; font-weight:700}
  header p{margin:0; color:var(--muted)}
  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin:20px 0 26px; padding:12px 14px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
  }
